name: Deploy Fitora to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo "Missing repository secret: VPS_HOST"; exit 1; }
          test -n "$VPS_USER" || { echo "Missing repository secret: VPS_USER"; exit 1; }
          test -n "$VPS_SSH_KEY" || { echo "Missing repository secret: VPS_SSH_KEY"; exit 1; }
          VPS_PORT="${VPS_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null || {
            echo "VPS_SSH_KEY is not a readable private key. Check the complete file contents."
            exit 1
          }
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          echo "VPS_PORT=$VPS_PORT" >> "$GITHUB_ENV"
          echo "VPS_HOST=$VPS_HOST" >> "$GITHUB_ENV"
          echo "VPS_USER=$VPS_USER" >> "$GITHUB_ENV"

      - name: Deploy
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -se' <<'DEPLOY_SCRIPT'
          set -euo pipefail
          APP_DIR="$HOME/fitora"
          if [ ! -d "$APP_DIR/.git" ]; then
            git clone --branch main https://github.com/dcorp-sas/FITORA.git "$APP_DIR"
          fi
          cd "$APP_DIR"
          git fetch origin main
          git reset --hard origin/main
          docker compose -f docker-compose.yml up -d --build --remove-orphans
          docker compose -f docker-compose.yml ps
          DEPLOY_SCRIPT
